[project]
name = "wow-profit"
version = "0.1.0"
description = "Local WoW Forever crafting profit finder (items, recipes, AH prices, disenchant chains)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
ui = ["fastapi>=0.115", "uvicorn>=0.30", "streamlit>=1.35"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "httpx>=0.27"]

[project.scripts]
wowprofit = "wowprofit.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
# Streamlit pulls these in; numpy's stubs use 3.12-only syntax that mypy rejects under python_version 3.11.
module = ["numpy", "numpy.*", "pandas", "pandas.*", "pyarrow", "pyarrow.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
