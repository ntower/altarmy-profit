# For the alembic command line, e.g. `alembic revision --autogenerate -m "..."` or `alembic upgrade head`.
# The app migrates on its own (db.Database.ensure_schema). The database is DATABASE_URL, else
# data/altarmy-profit.sqlite; set sqlalchemy.url here (or pass -x) to point elsewhere.
[alembic]
script_location = altarmy_profit:migrations
file_template = %%(rev)s_%%(slug)s
